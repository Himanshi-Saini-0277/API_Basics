<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            background: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin: 0 auto 20px;
        }
        h2 { color: #333; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        a {
            display: inline-block;
            padding: 10px 28px;
            background: #ef4444;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        a:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">{{ username[0].upper() }}</div>
        <h2>Welcome, {{ username }}!</h2>
        <p>You have successfully logged in.</p>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
